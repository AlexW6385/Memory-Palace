<!doctype html>
<html lang="en" data-lang="en">
<head>
<title>Memory Palace</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A walkable 3D memory palace by the method of loci: real buildings of many ages, planned as they were used, with numbered loci along their routes.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 54h48M12 54V28M24 54V28M40 54V28M52 54V28M6 28h52L32 10z' fill='none' stroke='%23a8741f' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Marcellus&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <canvas id="view" tabindex="0" aria-label="Memory Palace 3D view"></canvas>

  <div id="loading" class="loading">
    <div class="loading-inner">
      <svg class="loading-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 54h48M12 54V28M24 54V28M40 54V28M52 54V28M6 28h52L32 10z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <h1 class="loading-title" data-t="title">Memory Palace</h1>
      <p class="loading-tag" data-t="tagline"></p>
      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
      <p id="loading-msg" class="loading-msg"></p>
    </div>
  </div>

  <header class="topbar">
    <button id="where" class="where" type="button" data-t-label="places">
      <span class="where-mark" aria-hidden="true"></span>
      <span class="where-text"><span id="where-sys" class="where-sys"></span><span id="where-room" class="where-room"></span></span>
    </button>
    <nav class="tools" aria-label="Tools">
      <button id="btn-places" class="tool" type="button" aria-pressed="false" data-t-label="places"><span class="tool-label" data-t="places"></span></button>
      <button id="btn-map" class="tool" type="button" aria-pressed="false" data-t-label="map"><span class="tool-label" data-t="map"></span></button>
      <button id="btn-lang" class="tool tool-lang" type="button"><span class="tool-label"></span></button>
      <button id="btn-help" class="tool tool-icon" type="button" data-t-label="help"></button>
    </nav>
  </header>

  <div id="toast" class="toast" hidden aria-live="polite"></div>
  <div id="caption" class="caption" hidden aria-live="polite"></div>
  <p id="hint" class="hint" hidden></p>
  <div id="joy" class="joy" hidden aria-hidden="true"><div class="joy-knob"></div></div>

  <aside id="places" class="drawer" hidden>
    <div class="drawer-head">
      <label class="search-wrap"><span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span>
        <input id="search" class="search" type="search" data-t-ph="search" autocomplete="off"></label>
      <button id="places-close" class="icon-btn" type="button" data-t-label="close"></button>
    </div>
    <div id="places-body" class="drawer-body"></div>
  </aside>

  <div id="map" class="mapview" hidden>
    <canvas id="map-canvas" aria-label="Map"></canvas>
    <p class="map-tip" data-t="mapTip"></p>
    <div class="map-ctl">
      <button id="map-in" class="icon-btn" type="button" aria-label="Zoom in"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="map-out" class="icon-btn" type="button" aria-label="Zoom out"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="map-here" class="icon-btn" type="button" aria-label="Where am I"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>
    </div>
    <button id="map-close" class="icon-btn map-close" type="button" data-t-label="close"></button>
  </div>

  <div id="help" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-labelledby="help-title">
      <svg class="modal-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 54h48M12 54V28M24 54V28M40 54V28M52 54V28M6 28h52L32 10z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <h2 id="help-title" class="modal-title" data-t="welcomeTitle"></h2>
      <p class="modal-body" data-t="welcomeBody"></p>
      <ol class="how">
        <li><span class="how-n">1</span><span data-t="welcomeHow1"></span></li>
        <li><span class="how-n">2</span><span data-t="welcomeHow2"></span></li>
        <li><span class="how-n">3</span><span data-t="welcomeHow3"></span></li>
        <li><span class="how-n">4</span><span data-t="welcomeHow4"></span></li>
      </ol>
      <div class="modal-actions">
        <button id="help-close" class="btn btn-primary" type="button" data-t="welcomeGo"></button>
      </div>
    </div>
  </div>

  <div id="fade" class="fade" aria-hidden="true"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
