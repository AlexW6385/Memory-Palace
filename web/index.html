<!doctype html>
<html lang="zh-CN">
<head>
<title>记忆宫殿</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="记忆宫殿三维场景"></canvas>

  <div id="loading" class="loading">
    <div class="loading-mark" aria-hidden="true"></div>
    <p class="loading-title">记忆宫殿</p>
    <p id="loading-msg" class="loading-msg">正在铺设道路…</p>
  </div>

  <header class="hud-top">
    <button id="where" class="where" type="button" aria-label="当前位置，打开目录">
      <span id="where-sys" class="where-sys">中央广场</span>
      <span id="where-room" class="where-room">从这里走向各个知识体系</span>
    </button>
    <nav class="tools" aria-label="工具">
      <button id="btn-dir" class="tool" type="button">目录</button>
      <button id="btn-map" class="tool" type="button">地图</button>
      <button id="btn-tour" class="tool tool-accent" type="button">导览</button>
    </nav>
  </header>

  <div id="tourmenu" class="popover" hidden>
    <p class="popover-title">选择一条导览路线</p>
    <ul id="tour-list" class="tour-list"></ul>
  </div>

  <div id="joy" class="joy" hidden aria-hidden="true"><div class="joy-knob"></div></div>
  <p id="hint" class="hint" hidden></p>

  <aside id="card" class="card" hidden aria-live="polite">
    <div class="card-grip" aria-hidden="true"></div>
    <button id="card-close" class="icon-btn card-close" type="button" aria-label="关闭">×</button>
    <div class="card-scroll">
      <p id="card-crumb" class="crumb"></p>
      <h2 class="card-title"><span id="card-emoji" class="card-emoji"></span><span id="card-name"></span></h2>
      <p id="card-summary" class="card-summary"></p>
      <p id="card-detail" class="card-detail"></p>
      <section class="card-image">
        <h3 class="label">记忆画面</h3>
        <p id="card-image"></p>
      </section>
      <ul id="card-kw" class="chips"></ul>
      <section id="card-links-wrap" class="card-links">
        <h3 class="label">关联</h3>
        <ul id="card-links"></ul>
      </section>
    </div>
    <footer class="card-foot">
      <button id="card-prev" class="foot-btn" type="button">上一件</button>
      <span id="card-pos" class="card-pos"></span>
      <button id="tour-pause" class="foot-btn" type="button" hidden>暂停</button>
      <button id="card-next" class="foot-btn foot-primary" type="button">下一件</button>
    </footer>
  </aside>

  <aside id="dir" class="drawer" hidden aria-label="目录">
    <div class="drawer-head">
      <input id="search" class="search" type="search" placeholder="搜索展品、关键词…" autocomplete="off">
      <button id="dir-close" class="icon-btn" type="button" aria-label="关闭目录">×</button>
    </div>
    <div id="dir-body" class="drawer-body"></div>
    <form id="gen" class="gen" hidden>
      <p class="gen-title">让 AI 建一个新区域</p>
      <input id="gen-topic" class="search" type="text" placeholder="主题，例如：线性代数、我的实习经验" required>
      <textarea id="gen-notes" class="search gen-notes" rows="3" placeholder="可选：贴上你的笔记、经历或要求"></textarea>
      <button id="gen-go" class="foot-btn foot-primary" type="submit">开始建造</button>
      <pre id="gen-log" class="gen-log" hidden></pre>
    </form>
  </aside>

  <div id="map" class="mapview" hidden>
    <canvas id="map-canvas" aria-label="世界地图"></canvas>
    <p class="map-tip">点一个区域即可前往</p>
    <button id="map-close" class="icon-btn map-close" type="button" aria-label="关闭地图">×</button>
  </div>

  <div id="fade" class="fade" aria-hidden="true"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
