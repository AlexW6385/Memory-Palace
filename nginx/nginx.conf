events {}

http {
    upstream universe {
        server universe_api:8000;
    }

    upstream agent {
        server agent_api:8001;
    }

    server {
        listen 80;

        # WebSocket support for Universe Service
        location /ws {
            proxy_pass http://universe/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Universe Service endpoints
        location /nodes { proxy_pass http://universe/nodes; }
        location /edges { proxy_pass http://universe/edges; }
        location /search { proxy_pass http://universe/search; }
        location /graph { proxy_pass http://universe/graph; }

        # Agent Service endpoints
        location /tasks { proxy_pass http://agent/tasks; }
        location /skills { proxy_pass http://agent/skills; }

        # Serve static frontend Web Application
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Backup docs route for direct access
        location /docs { proxy_pass http://universe/docs; }
    }
}
