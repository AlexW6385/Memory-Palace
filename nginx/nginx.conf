events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        # Docker's embedded DNS resolver.
        # 'valid=10s' forces re-resolution every 10 s so nginx picks up new
        # container IPs automatically after a 'docker compose up -d' rebuild —
        # no manual nginx restart needed.
        # Variables in proxy_pass activate per-request DNS resolution.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # WebSocket — Universe Service
        location /ws {
            set $upstream_universe universe_api:8000;
            proxy_pass http://$upstream_universe;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Universe Service endpoints (variable host → per-request DNS)
        location /nodes  { set $u universe_api:8000; proxy_pass http://$u; }
        location /edges  { set $u universe_api:8000; proxy_pass http://$u; }
        location /search { set $u universe_api:8000; proxy_pass http://$u; }
        location /graph  { set $u universe_api:8000; proxy_pass http://$u; }
        location /docs   { set $u universe_api:8000; proxy_pass http://$u; }

        # Agent Service endpoints
        location /tasks  { set $a agent_api:8001; proxy_pass http://$a; }
        location /skills { set $a agent_api:8001; proxy_pass http://$a; }

        # Static frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            etag on;
        }
    }
}
