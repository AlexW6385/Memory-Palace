[tool.poetry]
name = "knowledge-agent"
version = "0.1.0"
description = "Core B: Agent Ingestion & Integration Service"
authors = ["Knowledge Universe"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
arq = "^0.26"
redis = {extras = ["asyncio"], version = "^5.0"}
structlog = "^24.2"
openai = "^1.30"
httpx = "^0.27"
trafilatura = "^1.8"
beautifulsoup4 = "^4.12"
pymupdf = "^1.24"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
pgvector = "^0.3"

[tool.poetry.dev-dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
