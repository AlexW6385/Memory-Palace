[tool.poetry]
name = "knowledge-universe"
version = "0.1.0"
description = "Core A: Knowledge Universe Service"
authors = ["Knowledge Universe"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
psycopg2-binary = "^2.9"
alembic = "^1.13"
pgvector = "^0.3"
redis = {extras = ["asyncio"], version = "^5.0"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
structlog = "^24.2"
openai = "^1.30"

[tool.poetry.dev-dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
