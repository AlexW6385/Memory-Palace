[project]
name = "memory-palace"
version = "2.0.0"
description = "Knowledge systems laid out as a walkable, bilingual 3D memory palace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "anthropic>=0.40",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
palace = "palace.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["palace*"]

[tool.setuptools.package-data]
palace = ["catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
