[project]
name = "memory-palace"
version = "4.0.0"
description = "A walkable 3D memory palace of real buildings, planned as they were used, for the method of loci"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
palace = "palace.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["palace*"]

[tool.setuptools.package-data]
palace = ["catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
