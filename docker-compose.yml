services:
  postgres:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: ku_user
      POSTGRES_PASSWORD: ku_password
      POSTGRES_DB: knowledge_universe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ku_user -d knowledge_universe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  universe_api:
    build:
      context: .
      dockerfile: universe/Dockerfile
    platform: linux/amd64
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Run alembic upgrade head before starting the API
    command: bash -c "cd /app/universe && poetry run alembic upgrade head && uvicorn universe.main:app --host 0.0.0.0 --port 8000 --workers 2"

  agent_api:
    build:
      context: .
      dockerfile: agent/Dockerfile
    platform: linux/amd64
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn agent.main:app --host 0.0.0.0 --port 8001 --workers 2

  agent_worker:
    build:
      context: .
      dockerfile: agent/Dockerfile
    platform: linux/amd64
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Start the custom Arq worker pool
    command: poetry run arq agent.workers.pool.get_worker_settings

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - universe_api
      - agent_api

volumes:
  pgdata:
  redisdata:
